<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - WiFi5 Soft by JEZKA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="text-center text-white p-8">
        <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-8 max-w-md">
            <div class="w-24 h-24 mx-auto mb-4 rounded-2xl bg-white/20 flex items-center justify-center overflow-hidden">
                <img src="/images/logo.png" alt="WiFi5 Soft" class="w-16 h-16 object-cover">
            </div>
            <i class="fas fa-wifi-slash text-6xl mb-4"></i>
            <h1 class="text-3xl font-bold mb-2">You're Offline</h1>
            <p class="text-gray-200 mb-6">Please check your internet connection to access tutorials</p>
            <p class="text-sm text-gray-300 mb-4">WiFi5 Soft by JEZKA | BANZ JEZKA.net</p>
            <button onclick="location.reload()" class="bg-white text-purple-600 px-6 py-3 rounded-lg font-semibold hover:shadow-lg transition">
                <i class="fas fa-sync-alt mr-2"></i> Try Again
            </button>
        </div>
    </div>
</body>
</html>
