<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WiFi5 Soft - Tech Tutorial Platform</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Branding & Favicon -->
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="apple-touch-icon" href="/images/logo.png">
    <meta name="author" content="JEZKA">
    <meta name="brand" content="WiFi5 Soft - BANZ JEZKA.net">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- Navigation -->
    <nav class="bg-white dark:bg-gray-900 shadow-md sticky top-0 z-50">
        <div class="px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Left side: Mobile menu button + Logo -->
                <!-- Left side: Mobile menu button + Logo -->
                <div class="flex items-center gap-2">
                    <button id="mobileMenuBtn" class="mobile-menu-btn" style="display: none;">
                        <i class="fas fa-bars"></i>
                    </button>

                    <!-- Logo with click navigation -->
                    <div class="flex items-center gap-2 cursor-pointer group" onclick="window.navigateTo('home')">
                        <!-- Logo Image -->
                        <div
                            class="w-10 h-10 rounded-xl overflow-hidden bg-gradient-to-r from-purple-600 to-indigo-600 flex items-center justify-center">
                            <img src="/images/logo.png" alt="WiFi5 Soft Logo" class="w-full h-full object-cover">
                        </div>

                        <!-- Logo Text -->
                        <div class="hidden sm:block">
                            <span
                                class="font-extrabold text-lg bg-gradient-to-r from-purple-600 to-indigo-600 bg-clip-text text-transparent">WiFi5
                                Soft</span>
                            <span class="text-xs text-gray-500 dark:text-gray-400 block -mt-1">by JEZKA</span>
                        </div>
                    </div>
                </div>

                <!-- Install PWA Button -->
                <div id="installPWA" class="hidden"></div>

                <!-- Right side: Auth buttons and user menu -->
                <div class="flex items-center gap-3">
                    <button id="themeToggleBtn"
                        class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition">
                        <i class="fas fa-moon"></i>
                    </button>

                    <div id="authLinks" class="flex gap-2">
                        <button onclick="window.showAuthModal('login')"
                            class="px-5 py-2 rounded-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-medium hover:shadow-lg transition text-sm sm:text-base">Login</button>
                        <button onclick="window.showAuthModal('register')"
                            class="px-5 py-2 rounded-full border-2 border-purple-600 text-purple-600 dark:text-purple-400 font-medium hover:bg-purple-50 dark:hover:bg-purple-900/20 transition text-sm sm:text-base">Sign
                            Up</button>
                    </div>

                    <div id="userMenu" class="hidden relative">
                        <button id="userMenuBtn" class="flex items-center gap-2 focus:outline-none">
                            <img id="userAvatar" class="w-10 h-10 rounded-full object-cover border-2 border-purple-500"
                                src="">
                            <i class="fas fa-chevron-down text-xs text-gray-500 hidden sm:inline"></i>
                        </button>
                        <div id="userDropdown"
                            class="absolute right-0 mt-2 w-56 bg-white dark:bg-gray-800 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700 hidden z-50">
                            <div class="p-4 border-b border-gray-200 dark:border-gray-700">
                                <p id="userName" class="font-semibold"></p>
                                <p id="userEmail" class="text-sm text-gray-500"></p>
                            </div>
                            <div class="py-2">
                                <a href="#" onclick="window.navigateTo('dashboard'); return false;"
                                    class="flex items-center gap-3 px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                                    <i class="fas fa-tachometer-alt w-5"></i> Dashboard
                                </a>
                                <a href="#" id="adminMenuItem" onclick="window.navigateTo('admin'); return false;"
                                    class="flex items-center gap-3 px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 transition hidden">
                                    <i class="fas fa-crown w-5 text-yellow-500"></i> Admin Panel
                                </a>
                                <hr class="my-2">
                                <a href="#" onclick="window.logout(); return false;"
                                    class="flex items-center gap-3 px-4 py-2 text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 transition">
                                    <i class="fas fa-sign-out-alt w-5"></i> Logout
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="appRoot" class="w-full"></main>

    <!-- Footer -->
    <footer class="bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 mt-12">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
                <!-- Footer Logo -->
                <div class="flex items-center gap-2">
                    <div
                        class="w-8 h-8 rounded-lg bg-gradient-to-r from-purple-600 to-indigo-600 flex items-center justify-center overflow-hidden">
                        <img src="/images/logo.png" alt="Logo" class="w-full h-full object-cover">
                    </div>
                    <span class="text-sm font-semibold text-gray-700 dark:text-gray-300">WiFi5 Soft</span>
                </div>

                <!-- Copyright -->
                <div class="text-center text-sm text-gray-500">
                    Developed by <span class="font-semibold text-purple-600">JEZKA</span>.
                    Made with ❤️ for WIFI5SOFT Users.
                </div>

                <!-- Brand -->
                <div class="text-xs text-gray-400">
                    © 2024 BANZ JEZKA.net
                </div>
            </div>
        </div>
    </footer>

    <!-- Auth Modal -->
    <!-- Auth Modal -->
    <div id="authModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center">
        <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 max-w-md w-full mx-4">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-2xl font-bold">Login</h3>
                <button onclick="window.closeAuthModal()" class="text-gray-500 hover:text-gray-700"><i
                        class="fas fa-times text-xl"></i></button>
            </div>
            <form id="authForm" onsubmit="return false;">
                <div id="nameField" class="mb-4 hidden">
                    <label class="block text-sm font-medium mb-2">Full Name</label>
                    <input type="text" id="registerName"
                        class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">Email</label>
                    <input type="email" id="authEmail" required
                        class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">Password</label>
                    <input type="password" id="authPassword" required
                        class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700">
                    <div class="text-right mt-1">
                        <button type="button" onclick="window.showForgotPassword()"
                            class="text-xs text-purple-600 hover:underline">
                            Forgot Password?
                        </button>
                    </div>
                </div>
                <div id="confirmField" class="mb-4 hidden">
                    <label class="block text-sm font-medium mb-2">Confirm Password</label>
                    <input type="password" id="confirmPassword"
                        class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700">
                </div>
                <button type="submit"
                    class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white py-2 rounded-lg font-semibold">Login</button>
            </form>
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-300 dark:border-gray-600"></div>
                </div>
                <div class="relative flex justify-center text-sm"><span
                        class="px-2 bg-white dark:bg-gray-800 text-gray-500">Or continue with</span></div>
            </div>
            <button onclick="window.googleSignIn()"
                class="w-full border border-gray-300 dark:border-gray-600 py-2 rounded-lg flex items-center justify-center gap-2 hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                <i class="fab fa-google text-red-500"></i> Google
            </button>
            <p class="text-center text-sm text-gray-600 dark:text-gray-400 mt-4">
                <span id="toggleAuthText">Don't have an account?</span>
                <button onclick="window.toggleAuthMode()" class="text-purple-600 hover:underline">Sign Up</button>
            </p>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 hidden"></div>

    <!-- Scripts -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/utils.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/upload.js"></script>
    <script type="module" src="js/components.js"></script>
    <script type="module" src="js/main.js"></script>
    <!-- PWA Script -->
    <script type="module">
        import { registerPWA, setupOfflineSupport, isStandalone } from './js/pwa.js';

        // Register PWA
        registerPWA();
        setupOfflineSupport();

        // Add offline class if needed
        if (isStandalone()) {
            document.body.classList.add('installed-app');
        }
    </script>
</body>

</html>
