<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi5 Soft - Tech Tutorial Platform</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { transition: background-color 0.3s ease; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e1e2e; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #8b5cf6, #3b82f6); border-radius: 10px; }
        
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .dark .glass {
            background: rgba(0, 0, 0, 0.3);
        }
        
        .video-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -12px rgba(0, 0, 0, 0.3);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(139, 92, 246, 0.4);
        }
        
        .modal-enter {
            animation: modalFadeIn 0.3s ease-out;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .toast-show {
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .spinner {
            border: 3px solid rgba(139, 92, 246, 0.3);
            border-radius: 50%;
            border-top: 3px solid #8b5cf6;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 1rem;
        }
        .video-wrapper iframe,
        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">

    <!-- Navigation -->
    <nav class="sticky top-0 z-50 bg-white/95 dark:bg-gray-800/95 backdrop-blur-md border-b border-gray-200 dark:border-gray-700 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-2 cursor-pointer" onclick="if(window.navigateTo) window.navigateTo('home')">
                    <div class="w-8 h-8 bg-gradient-to-r from-purple-500 to-blue-500 rounded-lg flex items-center justify-center">
                        <i class="fas fa-wifi text-white text-sm"></i>
                    </div>
                    <span class="font-extrabold text-xl bg-gradient-to-r from-purple-600 to-blue-600 bg-clip-text text-transparent">WiFi5 Soft</span>
                </div>
                
                <div class="hidden md:flex flex-1 max-w-md mx-6">
                    <div class="relative w-full">
                        <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 text-sm"></i>
                        <input type="text" id="searchInput" placeholder="Search tutorials..." 
                               class="w-full pl-10 pr-4 py-2 rounded-full bg-gray-100 dark:bg-gray-700 border focus:outline-none focus:ring-2 focus:ring-purple-500">
                    </div>
                </div>
                
                <div class="flex items-center gap-2">
                    <button id="themeToggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                        <i class="fas fa-moon text-gray-600 dark:hidden"></i>
                        <i class="fas fa-sun hidden dark:inline text-yellow-400"></i>
                    </button>
                    
                    <div id="authLinks" class="flex gap-2">
                        <button onclick="if(window.showAuthModal) window.showAuthModal('login')" class="px-4 py-1.5 text-sm font-medium rounded-lg btn-primary text-white">Login</button>
                        <button onclick="if(window.showAuthModal) window.showAuthModal('register')" class="px-4 py-1.5 text-sm font-medium rounded-lg border-2 border-purple-500 text-purple-600 dark:text-purple-400">Sign Up</button>
                    </div>
                    
                    <div id="userMenu" class="hidden relative">
                        <button id="userMenuBtn" class="flex items-center gap-2 focus:outline-none group">
                            <img id="userAvatar" class="w-9 h-9 rounded-full object-cover border-2 border-purple-500" src="">

                        </button>
                        <div class="absolute right-0 mt-2 w-64 bg-white dark:bg-gray-800 rounded-xl shadow-2xl border hidden group-hover:block z-50">
                            <div class="p-4 border-b">
                                <p id="userName" class="font-semibold"></p>
                                <p id="userEmail" class="text-sm text-gray-500"></p>
                            </div>
                            <div class="py-2">
                                <a href="#" onclick="if(window.navigateTo) window.navigateTo('dashboard')" class="flex items-center gap-3 px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-700">
                                    <i class="fas fa-tachometer-alt w-5"></i> Dashboard
                                </a>
                                <hr class="my-2">
                                <a href="#" onclick="if(window.logout) window.logout()" class="flex items-center gap-3 px-4 py-2 text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20">
                                    <i class="fas fa-sign-out-alt w-5"></i> Logout
                                </a>
                            </div>
                        </div>
                    </div>
                    
                    <div id="adminBadge" class="hidden">
                        <button onclick="if(window.navigateTo) window.navigateTo('admin')" class="px-3 py-1 text-xs font-bold rounded-full bg-gradient-to-r from-red-500 to-pink-500 text-white">
                            <i class="fas fa-crown"></i> Admin
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div>
                    <div class="flex items-center gap-2 mb-4">

                <div>

            </div>
            <div class="text-center text-sm text-gray-500 mt-8 pt-4 border-t">
                © 2024 WiFi5 Soft. All rights reserved.
            </div>
        </div>
    </footer>

    <!-- Auth Modal -->
    <div id="authModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center">
        <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 max-w-md w-full mx-4 modal-enter">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-2xl font-bold">Login</h3>
                <button onclick="if(window.closeAuthModal) window.closeAuthModal()" class="text-gray-500 hover:text-gray-700"><i class="fas fa-times text-xl"></i></button>
            </div>
            <form id="authForm" onsubmit="return false;">
                <div id="nameField" class="mb-4 hidden">
                    <label class="block text-sm font-medium mb-2">Full Name</label>
                    <input type="text" id="registerName" class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">Email</label>
                    <input type="email" id="authEmail" required class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">Password</label>
                    <input type="password" id="authPassword" required class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700">
                </div>
                <div id="confirmField" class="mb-4 hidden">
                    <label class="block text-sm font-medium mb-2">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700">
                </div>
                <button type="submit" class="w-full btn-primary text-white py-2 rounded-lg font-semibold">Login</button>
            </form>
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-300 dark:border-gray-600"></div></div>
                <div class="relative flex justify-center text-sm"><span class="px-2 bg-white dark:bg-gray-800 text-gray-500">Or continue with</span></div>
            </div>
            <button onclick="if(window.googleSignIn) window.googleSignIn()" class="w-full border border-gray-300 dark:border-gray-600 py-2 rounded-lg flex items-center justify-center gap-2 hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                <i class="fab fa-google text-red-500"></i> Google
            </button>
            <p class="text-center text-sm text-gray-600 dark:text-gray-400 mt-4">
                <span id="toggleAuthText">Don't have an account?</span>
                <button onclick="if(window.toggleAuthMode) window.toggleAuthMode()" class="text-purple-600 hover:underline">Sign Up</button>
            </p>
        </div>
    </div>

    <div id="toast" class="fixed bottom-5 right-5 z-50 hidden"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, query, where, orderBy, limit, addDoc, Timestamp, increment, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBvNv_zoMHhn-7WfGTzJv-ZB1XfEPGPhRw",
            authDomain: "wifi5soft-tutorial-system.firebaseapp.com",
            projectId: "wifi5soft-tutorial-system",
            storageBucket: "wifi5soft-tutorial-system.firebasestorage.app",
            messagingSenderId: "955837903608",
            appId: "1:955837903608:web:a736dc9313221d8d7cc10d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        let currentUser = null;
        let userRole = "guest";
        let authMode = "login";

        function showToast(message, type = "success") {
            const toast = document.getElementById("toast");
            const bgColor = type === "error" ? "bg-red-500" : type === "info" ? "bg-blue-500" : "bg-green-500";
            toast.innerHTML = `<div class="px-6 py-3 rounded-lg shadow-2xl ${bgColor} text-white toast-show">${message}</div>`;
            toast.classList.remove("hidden");
            setTimeout(() => toast.classList.add("hidden"), 3000);
        }

        function showLoading(show) {
            let loader = document.getElementById("loadingOverlay");
            if (!loader && show) {
                const div = document.createElement("div");
                div.id = "loadingOverlay";
                div.className = "fixed inset-0 bg-black/50 flex items-center justify-center z-50";
                div.innerHTML = '<div class="spinner"></div>';
                document.body.appendChild(div);
            }
            loader = document.getElementById("loadingOverlay");
            if (loader) {
                if (show) loader.classList.remove("hidden");
                else loader.classList.add("hidden");
            }
        }

        function getYouTubeEmbedUrl(url) {
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&]+)/,
                /youtube\.com\/embed\/([^?]+)/
            ];
            for (let pattern of patterns) {
                const match = url.match(pattern);
                if (match) return `https://www.youtube.com/embed/${match[1]}`;
            }
            return url;
        }

        function getVideoEmbedHtml(url) {
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                const embedUrl = getYouTubeEmbedUrl(url);
                return `<iframe src="${embedUrl}" allowfullscreen></iframe>`;
            } else if (url.includes('vimeo.com')) {
                const videoId = url.match(/vimeo\.com\/(\d+)/)?.[1];
                if (videoId) {
                    return `<iframe src="https://player.vimeo.com/video/${videoId}" allowfullscreen></iframe>`;
                }
            }
            return `<video controls><source src="${url}" type="video/mp4"></video>`;
        }

        window.navigateTo = async function(page, params = {}) {
            const appRoot = document.getElementById("appRoot");
            if (!appRoot) return;
            
            if (page === "home") {
                await renderHome(appRoot);
            } else if (page === "admin") {
                await renderAdmin(appRoot);
            } else if (page === "dashboard") {
                await renderDashboard(appRoot);
            } else if (page === "watch" && params.id) {
                await renderWatch(appRoot, params.id);
            }
        };

        async function renderHome(container) {
            container.innerHTML = `
                <div class="space-y-10">
                    <div class="relative overflow-hidden rounded-2xl bg-gradient-to-r from-purple-600/20 via-blue-600/20 to-purple-600/20 p-8 text-center">
                        <h1 class="text-4xl md:text-5xl font-extrabold mb-4 bg-gradient-to-r from-purple-600 to-blue-600 bg-clip-text text-transparent">Master WiFi & Networking</h1>
                        <p class="text-lg text-gray-600 dark:text-gray-300 mb-6">Expert tutorials on Piso WiFi, router setup, troubleshooting, and IT infrastructure</p>
                    </div>
                    
                    <div>
                        <h2 class="text-2xl font-bold mb-4"><i class="fas fa-star text-yellow-500"></i> All Tutorials</h2>
                        <div id="allTutorialsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                    </div>
                </div>
            `;
            
            await loadAllTutorials();
        }

        async function loadAllTutorials() {
            try {
                const tutorialsRef = collection(db, "tutorials");
                const q = query(tutorialsRef, orderBy("uploadDate", "desc"));
                const querySnapshot = await getDocs(q);
                
                const container = document.getElementById("allTutorialsGrid");
                if (!container) return;
                
                if (querySnapshot.empty) {
                    container.innerHTML = `
                        <div class="col-span-full text-center py-12">
                            <i class="fas fa-video text-6xl text-gray-400 mb-4"></i>
                            <p class="text-gray-500">No tutorials yet.</p>
                            ${userRole === "admin" ? '<button onclick="window.navigateTo(\'admin\')" class="mt-4 btn-primary px-6 py-2 rounded-full text-white">Add Your First Tutorial</button>' : ''}
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = querySnapshot.docs.map(doc => {
                    const data = doc.data();
                    return `
                        <div class="video-card bg-white dark:bg-gray-800 rounded-xl overflow-hidden shadow-lg" onclick="window.navigateTo('watch', { id: '${doc.id}' })">
                            <img src="${data.thumbnailURL || 'https://placehold.co/400x225/7c3aed/white?text=WiFi5'}" class="w-full h-48 object-cover" loading="lazy" onerror="this.src='https://placehold.co/400x225/7c3aed/white?text=Video'">
                            <div class="p-4">
                                <h3 class="font-semibold text-lg line-clamp-2">${escapeHtml(data.title) || 'Untitled'}</h3>
                                <p class="text-sm text-gray-500 dark:text-gray-400 mt-2">
                                    <i class="fas fa-eye"></i> ${data.views || 0} views
                                </p>
                                <p class="text-xs text-purple-500 mt-1">${escapeHtml(data.category) || 'General'}</p>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error("Error loading tutorials:", error);
                showToast("Error loading tutorials", "error");
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function renderAdmin(container) {
            if (userRole !== "admin") {
                showToast("Admin access only", "error");
                window.navigateTo("home");
                return;
            }
            
            // Get current tutorials
            const tutorialsSnap = await getDocs(collection(db, "tutorials"));
            const usersSnap = await getDocs(collection(db, "users"));
            
            container.innerHTML = `
                <div class="space-y-6">
                    <h1 class="text-3xl font-bold bg-gradient-to-r from-purple-600 to-blue-600 bg-clip-text text-transparent">Admin Dashboard</h1>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="glass p-6 rounded-xl text-center">
                            <i class="fas fa-video text-3xl text-purple-500"></i>
                            <p class="text-2xl font-bold mt-2" id="statTutorials">${tutorialsSnap.size}</p>
                            <p>Tutorials</p>
                        </div>
                        <div class="glass p-6 rounded-xl text-center">
                            <i class="fas fa-users text-3xl text-blue-500"></i>
                            <p class="text-2xl font-bold mt-2">${usersSnap.size}</p>
                            <p>Users</p>
                        </div>
                        <div class="glass p-6 rounded-xl text-center">
                            <i class="fas fa-eye text-3xl text-yellow-500"></i>
                            <p class="text-2xl font-bold mt-2">${tutorialsSnap.docs.reduce((sum, d) => sum + (d.data().views || 0), 0)}</p>
                            <p>Total Views</p>
                        </div>
                    </div>
                    
                    <div class="glass rounded-xl p-6">
                        <h2 class="text-xl font-bold mb-4"><i class="fas fa-link"></i> Add New Tutorial</h2>
                        <form id="adminUploadForm" class="space-y-4">
                            <input type="text" id="uploadTitle" placeholder="Video Title *" required class="w-full p-3 rounded-lg bg-gray-100 dark:bg-gray-700">
                            <textarea id="uploadDesc" placeholder="Description" rows="3" class="w-full p-3 rounded-lg bg-gray-100 dark:bg-gray-700"></textarea>
                            <input type="text" id="uploadCategory" placeholder="Category (WiFi Setup, Router Config, Piso WiFi, Networking)" class="w-full p-3 rounded-lg bg-gray-100 dark:bg-gray-700">
                            <input type="url" id="uploadVideoUrl" placeholder="Video URL * (YouTube, Vimeo, or direct video link)" required class="w-full p-3 rounded-lg bg-gray-100 dark:bg-gray-700">
                            <input type="url" id="uploadThumbUrl" placeholder="Thumbnail Image URL (optional)" class="w-full p-3 rounded-lg bg-gray-100 dark:bg-gray-700">
                            <div class="text-sm text-gray-500 bg-blue-50 dark:bg-blue-900/20 p-3 rounded-lg">
                                <i class="fas fa-info-circle text-blue-500"></i> 
                                <strong>Example YouTube links:</strong><br>
                                https://youtube.com/watch?v=VIDEO_ID<br>
                                https://youtu.be/VIDEO_ID<br>
                                <strong>Example thumbnail:</strong> https://img.youtube.com/vi/VIDEO_ID/maxresdefault.jpg
                            </div>
                            <label class="flex items-center gap-2">
                                <input type="checkbox" id="uploadFeatured"> Featured Tutorial
                            </label>
                            <button type="submit" class="btn-primary text-white px-6 py-2 rounded-lg">Add Tutorial</button>
                        </form>
                    </div>
                    
                    <div class="glass rounded-xl p-6">
                        <h2 class="text-xl font-bold mb-4">Manage Existing Tutorials</h2>
                        <div id="manageTutorialsList" class="space-y-2 max-h-96 overflow-y-auto"></div>
                    </div>
                </div>
            `;
            
            // Display existing tutorials
            const listContainer = document.getElementById("manageTutorialsList");
            if (tutorialsSnap.empty) {
                listContainer.innerHTML = '<div class="text-center text-gray-500 py-8">No tutorials yet. Add your first one above!</div>';
            } else {
                listContainer.innerHTML = tutorialsSnap.docs.map(docSnap => {
                    const data = docSnap.data();
                    return `
                        <div class="flex justify-between items-center p-3 rounded-lg bg-gray-100 dark:bg-gray-700">
                            <div class="flex-1">
                                <strong>${escapeHtml(data.title)}</strong>
                                <br><small class="text-gray-500">${data.views || 0} views | ${data.category || 'Uncategorized'}</small>
                            </div>
                            <button onclick="window.deleteTutorial('${docSnap.id}')" class="text-red-500 hover:text-red-700 px-3 py-1 rounded">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </div>
                    `;
                }).join('');
            }
            
            // Handle form submission
            const form = document.getElementById("adminUploadForm");
            if (form) {
                form.onsubmit = async (e) => {
                    e.preventDefault();
                    
                    const title = document.getElementById("uploadTitle").value;
                    const videoUrl = document.getElementById("uploadVideoUrl").value;
                    
                    if (!title || !videoUrl) {
                        showToast("Please fill in title and video URL", "error");
                        return;
                    }
                    
                    showLoading(true);
                    
                    try {
                        await addDoc(collection(db, "tutorials"), {
                            title: title,
                            description: document.getElementById("uploadDesc").value || "",
                            category: document.getElementById("uploadCategory").value || "General",
                            videoURL: videoUrl,
                            thumbnailURL: document.getElementById("uploadThumbUrl").value || "https://placehold.co/400x225/7c3aed/white?text=WiFi5",
                            featured: document.getElementById("uploadFeatured")?.checked || false,
                            views: 0,
                            likes: 0,
                            uploadDate: Timestamp.now(),
                            uploader: currentUser?.uid
                        });
                        
                        showToast("Tutorial added successfully!");
                        document.getElementById("adminUploadForm").reset();
                        await renderAdmin(container);
                    } catch (error) {
                        console.error("Error adding tutorial:", error);
                        showToast("Error adding tutorial: " + error.message, "error");
                    } finally {
                        showLoading(false);
                    }
                };
            }
        }

        async function renderDashboard(container) {
            if (!currentUser) {
                showToast("Please login", "error");
                window.navigateTo("home");
                return;
            }
            
            const userDoc = await getDoc(doc(db, "users", currentUser.uid));
            const savedVideos = userDoc.data()?.savedVideos || [];
            
            // Get saved video details
            let savedVideosList = [];
            if (savedVideos.length > 0) {
                const videoPromises = savedVideos.map(id => getDoc(doc(db, "tutorials", id)));
                const videoDocs = await Promise.all(videoPromises);
                savedVideosList = videoDocs.filter(d => d.exists()).map(d => ({ id: d.id, data: d.data() }));
            }
            
            container.innerHTML = `
                <div class="space-y-6">
                    <h1 class="text-3xl font-bold">My Dashboard</h1>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="glass p-6 rounded-xl">
                            <i class="fas fa-bookmark text-2xl text-purple-500"></i>
                            <p class="text-2xl font-bold mt-2">${savedVideos.length}</p>
                            <p>Saved Videos</p>
                        </div>
                        <div class="glass p-6 rounded-xl">
                            <i class="fas fa-user text-2xl text-blue-500"></i>
                            <p class="text-lg font-semibold mt-2">${escapeHtml(currentUser.displayName || currentUser.email)}</p>
                            <p>Welcome back!</p>
                        </div>
                    </div>
                    
                    <div class="glass rounded-xl p-6">
                        <h2 class="text-xl font-bold mb-4">Saved Tutorials</h2>
                        <div id="savedVideosGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${savedVideosList.length > 0 ? savedVideosList.map(v => `
                                <div class="flex gap-3 cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700 p-3 rounded-lg" onclick="window.navigateTo('watch', { id: '${v.id}' })">
                                    <img src="${v.data.thumbnailURL}" class="w-24 h-16 object-cover rounded">
                                    <div>
                                        <p class="font-semibold">${escapeHtml(v.data.title)}</p>
                                        <p class="text-sm text-gray-500">${v.data.views || 0} views</p>
                                    </div>
                                </div>
                            `).join('') : '<p class="text-gray-500 text-center py-8">No saved videos yet. Click the bookmark icon on videos to save them!</p>'}
                        </div>
                    </div>
                </div>
            `;
        }

        async function renderWatch(container, videoId) {
            if (!videoId) {
                window.navigateTo("home");
                return;
            }
            
            const videoDoc = await getDoc(doc(db, "tutorials", videoId));
            if (!videoDoc.exists()) {
                showToast("Video not found", "error");
                window.navigateTo("home");
                return;
            }
            
            const video = videoDoc.data();
            const videoEmbedHtml = getVideoEmbedHtml(video.videoURL);
            
            container.innerHTML = `
                <div class="flex flex-col lg:flex-row gap-8">
                    <div class="lg:w-2/3">
                        <div class="video-wrapper bg-black rounded-xl overflow-hidden shadow-2xl">
                            ${videoEmbedHtml}
                        </div>
                        <div class="mt-4">
                            <h1 class="text-2xl font-bold">${escapeHtml(video.title)}</h1>
                            <div class="flex items-center gap-4 mt-2 text-sm text-gray-500">
                                <span><i class="fas fa-eye"></i> ${video.views || 0} views</span>
                                <span><i class="fas fa-tag"></i> ${escapeHtml(video.category) || 'General'}</span>
                            </div>
                            <p class="text-gray-600 dark:text-gray-400 mt-4">${escapeHtml(video.description) || "No description available."}</p>
                            <div class="flex gap-4 mt-4">
                                <button onclick="window.saveVideo('${videoId}')" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition">
                                    <i class="fas fa-bookmark"></i> Save
                                </button>
                                <button onclick="window.shareVideo()" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition">
                                    <i class="fas fa-share"></i> Share
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="lg:w-1/3">
                        <h3 class="font-bold text-lg mb-3">Recommended</h3>
                        <div id="recommendedList" class="space-y-3"></div>
                    </div>
                </div>
            `;
            
            // Update view count
            await updateDoc(doc(db, "tutorials", videoId), { views: increment(1) });
            
            // Load recommended videos
            const tutorialsRef = collection(db, "tutorials");
            const recommendedQuery = query(tutorialsRef, where("category", "==", video.category || "General"), limit(5));
            const recommendedSnap = await getDocs(recommendedQuery);
            
            const recommendedList = document.getElementById("recommendedList");
            if (recommendedList) {
                const otherVideos = recommendedSnap.docs.filter(d => d.id !== videoId);
                if (otherVideos.length > 0) {
                    recommendedList.innerHTML = otherVideos.map(d => {
                        const data = d.data();
                        return `
                            <div class="flex gap-3 cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-800 p-2 rounded-lg transition" onclick="window.navigateTo('watch', { id: '${d.id}' })">
                                <img src="${data.thumbnailURL}" class="w-24 h-14 object-cover rounded" onerror="this.src='https://placehold.co/120x68/7c3aed/white?text=Video'">
                                <div>
                                    <p class="text-sm font-medium line-clamp-2">${escapeHtml(data.title)}</p>
                                    <p class="text-xs text-gray-500">${data.views || 0} views</p>
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    recommendedList.innerHTML = '<p class="text-gray-500 text-center">No recommended videos</p>';
                }
            }
        }

        window.saveVideo = async (videoId) => {
            if (!currentUser) {
                showToast("Login to save", "error");
                return;
            }
            try {
                const userRef = doc(db, "users", currentUser.uid);
                await updateDoc(userRef, { savedVideos: arrayUnion(videoId) });
                showToast("Saved to favorites!");
            } catch (error) {
                showToast("Error saving video", "error");
            }
        };

        window.shareVideo = () => {
            navigator.clipboard.writeText(window.location.href);
            showToast("Link copied to clipboard!");
        };

        window.deleteTutorial = async (id) => {
            if (confirm("Delete this tutorial permanently?")) {
                try {
                    await deleteDoc(doc(db, "tutorials", id));
                    showToast("Tutorial deleted");
                    window.navigateTo("admin");
                } catch (error) {
                    showToast("Error deleting tutorial", "error");
                }
            }
        };

        // Auth functions
        window.showAuthModal = function(mode) {
            const modal = document.getElementById("authModal");
            const title = document.getElementById("modalTitle");
            const nameField = document.getElementById("nameField");
            const confirmField = document.getElementById("confirmField");
            const submitBtn = document.querySelector("#authForm button");
            const toggleText = document.getElementById("toggleAuthText");
            const toggleBtn = document.getElementById("toggleAuthBtn");
            
            if (mode === "login") {
                title.innerText = "Login";
                nameField.classList.add("hidden");
                confirmField.classList.add("hidden");
                if (submitBtn) submitBtn.innerText = "Login";
                if (toggleText) toggleText.innerText = "Don't have an account?";
                if (toggleBtn) toggleBtn.innerText = "Sign Up";
                authMode = "login";
            } else {
                title.innerText = "Sign Up";
                nameField.classList.remove("hidden");
                confirmField.classList.remove("hidden");
                if (submitBtn) submitBtn.innerText = "Sign Up";
                if (toggleText) toggleText.innerText = "Already have an account?";
                if (toggleBtn) toggleBtn.innerText = "Login";
                authMode = "register";
            }
            modal.classList.remove("hidden");
            modal.classList.add("flex");
        };

        window.closeAuthModal = function() {
            document.getElementById("authModal").classList.add("hidden");
        };

        window.toggleAuthMode = function() {
            if (authMode === "login") window.showAuthModal("register");
            else window.showAuthModal("login");
        };

        window.googleSignIn = async function() {
            try {
                showLoading(true);
                const result = await signInWithPopup(auth, googleProvider);
                const userDoc = await getDoc(doc(db, "users", result.user.uid));
                if (!userDoc.exists()) {
                    await setDoc(doc(db, "users", result.user.uid), {
                        name: result.user.displayName,
                        email: result.user.email,
                        role: "user",
                        createdAt: Timestamp.now(),
                        savedVideos: []
                    });
                }
                showToast("Google sign in successful!");
                window.closeAuthModal();
                window.navigateTo("home");
            } catch (error) {
                showToast(error.message, "error");
            } finally {
                showLoading(false);
            }
        };

        window.logout = async function() {
            await signOut(auth);
            showToast("Logged out");
            window.navigateTo("home");
        };

        // Auth form handler
        const authForm = document.getElementById("authForm");
        if (authForm) {
            authForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                const email = document.getElementById("authEmail").value;
                const password = document.getElementById("authPassword").value;
                
                if (authMode === "login") {
                    try {
                        showLoading(true);
                        await signInWithEmailAndPassword(auth, email, password);
                        showToast("Login successful!");
                        window.closeAuthModal();
                        window.navigateTo("home");
                    } catch (error) {
                        showToast(error.message, "error");
                    } finally {
                        showLoading(false);
                    }
                } else {
                    const name = document.getElementById("registerName").value;
                    const confirm = document.getElementById("confirmPassword").value;
                    if (password !== confirm) {
                        showToast("Passwords don't match!", "error");
                        return;
                    }
                    if (password.length < 6) {
                        showToast("Password must be at least 6 characters!", "error");
                        return;
                    }
                    try {
                        showLoading(true);
                        const userCred = await createUserWithEmailAndPassword(auth, email, password);
                        await updateProfile(userCred.user, { displayName: name });
                        await setDoc(doc(db, "users", userCred.user.uid), {
                            name: name,
                            email: email,
                            role: "user",
                            createdAt: Timestamp.now(),
                            savedVideos: []
                        });
                        showToast("Account created! Please login.");
                        window.showAuthModal("login");
                    } catch (error) {
                        showToast(error.message, "error");
                    } finally {
                        showLoading(false);
                    }
                }
            });
        }

        // Theme toggle
        const themeToggle = document.getElementById("themeToggle");
        if (themeToggle) {
            themeToggle.addEventListener("click", () => {
                document.body.classList.toggle("dark");
                localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
            });
        }
        
        if (localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark");
        }

        // Search
        const searchInput = document.getElementById("searchInput");
        if (searchInput) {
            searchInput.addEventListener("keyup", (e) => {
                if (e.key === "Enter") {
                    showToast(`Searching for "${e.target.value}"...`, "info");
                }
            });
        }

        // Auth state listener
        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                userRole = userDoc.exists() ? userDoc.data().role : "user";
                
                const authLinks = document.getElementById("authLinks");
                const userMenu = document.getElementById("userMenu");
                const adminBadge = document.getElementById("adminBadge");
                const userAvatar = document.getElementById("userAvatar");
                const userName = document.getElementById("userName");
                const userEmail = document.getElementById("userEmail");
                
                if (authLinks) authLinks.classList.add("hidden");
                if (userMenu) userMenu.classList.remove("hidden");
                if (userAvatar) userAvatar.src = user.photoURL || `https://ui-avatars.com/api/?background=8b5cf6&color=fff&name=${user.displayName || user.email}`;
                if (userName) userName.innerText = user.displayName || user.email.split("@")[0];
                if (userEmail) userEmail.innerText = user.email;
                
                if (userRole === "admin" && adminBadge) {
                    adminBadge.classList.remove("hidden");
                } else if (adminBadge) {
                    adminBadge.classList.add("hidden");
                }
            } else {
                userRole = "guest";
                const authLinks = document.getElementById("authLinks");
                const userMenu = document.getElementById("userMenu");
                const adminBadge = document.getElementById("adminBadge");
                
                if (authLinks) authLinks.classList.remove("hidden");
                if (userMenu) userMenu.classList.add("hidden");
                if (adminBadge) adminBadge.classList.add("hidden");
            }
            window.navigateTo("home");
        });

        // Initial load
        window.navigateTo("home");
    </script>
</body>
</html>
